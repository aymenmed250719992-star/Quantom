version: "3.9"

services:
  quantom-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantom_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - EXCHANGE_MODE=demo
      - EXCHANGE_NAME=mexc
      - MIN_CONFIDENCE_SCORE=55
      - MAX_RISK_PERCENT=1.5
      - TARGET_WIN_RATE=65
      - SCAN_INTERVAL_MINUTES=5
      - _USE_SSL_RENDER=True
    env_file:
      - backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/trade/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
