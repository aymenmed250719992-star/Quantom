app = "quantom-v2"
primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile"
  dockerignore_file = "backend/.dockerignore"

[env]
  PORT              = "5000"
  EXCHANGE_MODE     = "demo"
  EXCHANGE_NAME     = "mexc"
  MIN_CONFIDENCE_SCORE = "55"
  MAX_RISK_PERCENT  = "1.5"
  TARGET_WIN_RATE   = "65"
  SCAN_INTERVAL_MINUTES = "5"
  _USE_SSL_RENDER   = "True"

[http_service]
  internal_port        = 5000
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval     = "30s"
    method       = "GET"
    path         = "/trade/health"
    port         = 5000
    timeout      = "10s"
    type         = "http"
