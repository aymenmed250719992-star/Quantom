app = "quantom-v2"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  EXCHANGE_NAME = "mexc"
  EXCHANGE_MODE = "demo"
  _USE_SSL_RENDER = "True"
  MIN_CONFIDENCE_SCORE = "55"
  MAX_RISK_PERCENT = "1.5"
  TARGET_WIN_RATE = "65"
  SCAN_INTERVAL_MINUTES = "5"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/trade/health"
  port = 5000
  timeout = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
