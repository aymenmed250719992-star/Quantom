services:
  - type: web
    name: quantom-v2
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /trade/health
    envVars:
      - key: EXCHANGE_NAME
        value: mexc
      - key: EXCHANGE_MODE
        value: demo
      - key: CEX_ALLOW_ALL
        value: "true"
      - key: DEX_NETWORK
        value: base
      - key: HYBRID_MODE
        value: auto
      - key: MIN_CONFIDENCE_SCORE
        value: "55"
      - key: MAX_RISK_PERCENT
        value: "1.5"
      - key: TARGET_WIN_RATE
        value: "65"
      - key: EXCHANGE_STRATEGY
        value: auto
      - key: _USE_SSL_RENDER
        value: "True"
      - key: SCAN_INTERVAL_MINUTES
        value: "5"
      - key: QUANTOM_DB_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
